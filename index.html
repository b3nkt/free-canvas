<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef">
<title>Canvas Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f4ef;--dot:#cdc9bd;--dot-rgb:205,201,189;--panel:#fff;--bd:#dcd8cc;--tx:#1f232b;--mut:#7b8090;--ac:#2f6bff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:14px/1.5 Poppins,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
#v{position:fixed;inset:0;touch-action:none;background-image:radial-gradient(rgba(var(--dot-rgb),var(--grid-alpha,.55)) var(--grid-dot-radius,1.3px),transparent calc(var(--grid-dot-radius,1.3px) + .35px));background-size:28px 28px}
#v.pen{cursor:crosshair}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
#w:before{content:"";position:absolute;left:-12px;top:-12px;width:24px;height:24px;pointer-events:none;opacity:.55;background:linear-gradient(var(--mut),var(--mut)) center/1.5px 100% no-repeat,linear-gradient(var(--mut),var(--mut)) center/100% 1.5px no-repeat}
.item{position:absolute;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:0 4px 18px #2a2f3a1f}
.item.sel{outline:2px solid var(--ac);outline-offset:1px}
.pen .item{pointer-events:none}
.h{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;font-size:12px;color:var(--mut);cursor:grab;touch-action:none;border-bottom:1px solid var(--bd)}
.h b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .ac{display:flex;gap:4px}
.h button{border:0;background:#0000000f;border-radius:6px;height:22px;padding:0 8px;font-size:12px}
.b{padding:10px 12px;outline:0;min-height:56px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.text{background:none;border:0;box-shadow:none;border-radius:3px;outline:1px solid transparent}
.text:hover{outline:1px solid #2f6bff44}
.text.sel,.text:focus-within{outline:1px solid var(--ac);outline-offset:0}
.text .h{display:none;position:absolute;left:-1px;right:-1px;bottom:100%;background:var(--panel);border:1px solid var(--bd);border-radius:7px 7px 0 0}
.text.sel .h,.text:focus-within .h{display:flex}
.text .b{padding:4px 6px;min-height:30px}
.text .b:empty:before{content:"Write something";color:var(--mut)}
.a4{overflow:hidden}
.a4 .h{background:#f3f1ea}
.a4 .b{height:calc(100% - 30px);padding:64px 72px;font-size:16px;overflow:hidden}
.b h2{margin:.3em 0;font-size:1.35em}
.b td{border:1px solid var(--bd);padding:6px 8px;min-width:60px;vertical-align:top}
.b table{border-collapse:collapse;white-space:normal;margin:6px 0}
.table .b{padding:8px;white-space:normal}.table table{width:100%}
.img .b,.pdf .b{padding:0}
.img img,.pdf canvas{display:block;width:100%;height:auto;border-radius:0 0 7px 7px;pointer-events:none}
.cap{padding:6px 10px;font-size:12px;color:var(--mut)}
.r{position:absolute;right:0;bottom:0;width:26px;height:26px;touch-action:none;cursor:nwse-resize;display:none;background:linear-gradient(135deg,transparent 55%,var(--ac) 55% 64%,transparent 64% 76%,var(--ac) 76% 85%,transparent 85%)}
.sel .r{display:block}
#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:5}
#ink path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#ink path.sel{filter:drop-shadow(0 0 3px var(--ac))}
#ink path.lasso-outline{fill:#2f6bff18;stroke:var(--ac);stroke-width:1.5;stroke-dasharray:5 4;pointer-events:none}
#mq{position:fixed;display:none;border:1px dashed var(--ac);background:#2f6bff14;pointer-events:none;z-index:6}
.bar{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:#fffffff2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;box-shadow:0 8px 30px #2a2f3a26;max-width:96vw;overflow-x:auto;z-index:10}
#bar{bottom:max(14px,env(safe-area-inset-bottom))}
#fmt{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 70px);display:none}
#fmt[data-m=t],#fmt[data-m=i]{display:flex}
#fmt[data-m=i] .tg,#fmt[data-m=t] .ig{display:none}
.bar button,.bar label{min-width:44px;height:42px;border:0;border-radius:11px;background:none;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;white-space:nowrap}
.ico{display:inline-block;width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bar button[data-t]{padding:0 12px}
.bar button .ico{width:19px;height:19px}
.bar .on{background:var(--ac);color:#fff}
.bar .sep{width:1px;height:24px;background:var(--bd);margin:0 5px;flex:none}
.bar i{display:block;border-radius:50%;background:currentColor}
#col{width:30px;height:30px;border:0;padding:0;border-radius:50%;background:none;margin:0 6px;flex:none}
#mb{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:12;width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:#fffffff2;display:flex;align-items:center;justify-content:center}
#mb .ico{width:23px;height:23px;stroke-width:2.7}
#menu{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;z-index:11;background:#fffffff7;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--bd);padding:70px 14px 14px;overflow:auto;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px #2a2f3a26}
#menu.open{transform:none}
.cv{border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0;cursor:pointer}
.cv.on{border-color:var(--ac)}
.cv .top{display:flex;align-items:center}.cv b{flex:1;font-weight:500}
.cv button{border:0;background:none;color:var(--mut);width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding:0}
.cv button .ico{width:17px;height:17px;stroke-width:2.4}
.cv small,.cv ul{color:var(--mut);font-size:12px}.cv ul{margin:6px 0 0;padding-left:18px}
.mh{font-size:12px;color:var(--mut);margin:18px 0 7px;display:flex;align-items:center;justify-content:space-between}
.mh .count{font-size:11px;font-weight:600;min-width:21px;padding:1px 6px;text-align:center;border-radius:99px;background:#eef1f7;color:#606779}
#filelist{display:flex;flex-direction:column;gap:4px}
.file-row{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;min-width:0}
.file-row:hover{background:#f3f5f9;border-color:#e6e9f0}
.file-icon{width:38px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:#edf1fa;color:#4a5c88;flex:none;font-size:9px;font-weight:700;letter-spacing:.3px}
.file-icon.pdf{background:#fcebea;color:#b34037}
.file-icon.img{background:#e8f5ef;color:#2d7958}
.file-icon.txt{background:#fff2db;color:#8a641b}
.file-info{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.file-info b{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.file-info small,.file-empty{font-size:11px;color:var(--mut)}
.file-empty{padding:12px 10px;border:1px dashed var(--bd);border-radius:10px}
.app{border:1px dashed var(--bd);border-radius:10px;padding:10px;color:var(--mut)}
#nc{width:100%;height:40px;border:1px dashed var(--bd);border-radius:10px;background:none}
#pv{position:fixed;inset:0;z-index:20;background:#ebe8e0;display:none;flex-direction:column;touch-action:pan-y}
#pv.open{display:flex}
.pb{display:flex;align-items:center;gap:14px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--bd)}
.pb button,.pg button{border:0;background:var(--ac);color:#fff;border-radius:9px;height:34px;padding:0 14px;font-weight:500}
.pg button:disabled{background:#c9c6bb}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{position:relative;max-width:100%}
.pg canvas{display:block;max-width:100%;height:auto;border-radius:3px;box-shadow:0 2px 12px #2a2f3a26}
.pg button{position:absolute;top:10px;right:10px}
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);padding:8px 14px;border-radius:10px;z-index:30;display:none}
</style></head><body>
<div id="v"><div id="w"><svg id="ink"></svg></div><div id="mq"></div></div>
<button id="mb" title="Canvases" aria-label="Open canvases menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
<div id="menu"><div class="mh">Canvases</div><div id="cl"></div><button id="nc">+ New canvas</button>
<div class="mh">Files on this canvas <span class="count" id="filecount">0</span></div><div id="filelist"><div class="file-empty">No files on this canvas yet.</div></div>
<div class="mh">Apps</div><div class="app">Toolbox<br><small>Coming soon</small></div></div>
<div id="fmt" class="bar" data-m="">
  <span class="tg" style="display:contents">
  <button data-f="b"><b>B</b></button><button data-f="i"><i style="background:none;border-radius:0;font-style:italic">I</i></button><button data-f="u"><u>U</u></button>
  <button data-f="h">Heading</button><button data-f="l">List</button><span class="sep"></span>
  <button data-f="t">Table</button><button data-f="row">+ Row</button><button data-f="col">+ Col</button></span>
  <button class="ig" data-f="di">Delete selection</button>
</div>
<div id="bar" class="bar">
  <button data-t="select" title="Move or select ink"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5 18.5 14l-6 .8-3.2 5.5z"/><path d="m13 15 3.2 5"/></svg><span>Move</span></button>
  <button data-t="lasso" title="Lasso select"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 9.3c0 4.4-5.2 8.3-9.8 8.3-3.6 0-5.8-1.8-5.8-4.5 0-4.1 5-8.2 10-8.2 3.4 0 5.6 1.7 5.6 4.4Z"/><path d="M15.2 16.1c.2 2.2 1.6 3.9 3.2 4"/></svg><span>Lasso</span></button>
  <button data-t="pen" class="on" title="Apple Pencil / pen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16.8-.8 4 4-.8L20 7.2 16.8 4z"/><path d="m14.9 5.9 3.2 3.2"/></svg><span>Pen</span></button>
  <button data-t="eraser" title="Erase ink"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m7.8 20-4-4a2 2 0 0 1 0-2.8l8.8-8.8a2 2 0 0 1 2.8 0l5.6 5.6a2 2 0 0 1 0 2.8L14 20z"/><path d="m9.2 10.8 6 6"/><path d="M14 20h6"/></svg><span>Erase</span></button>
  <button data-w="1.6" title="Fine"><i style="width:4px;height:4px"></i></button>
  <button data-w="3" class="on" title="Medium"><i style="width:7px;height:7px"></i></button>
  <button data-w="6" title="Thick"><i style="width:11px;height:11px"></i></button>
  <button data-w="12" title="Marker"><i style="width:16px;height:16px"></i></button>
  <input type="color" id="col" value="#1f232b" title="Pen colour">
  <span class="sep"></span>
  <button data-n="text" title="Add text"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M12 5v14M8 19h8"/></svg><span>Text</span></button><button data-n="a4" title="Add page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4V21H7z"/><path d="M14 3.5V8h4M10 13h5M10 17h5"/></svg><span>Page</span></button>
  <label title="Add files"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h7l2 2h8v10h-17z"/><path d="M12 12v5M9.5 14.5h5"/></svg><span>File</span><input type="file" id="fi" hidden multiple accept="image/*,application/pdf,.txt,.md"></label>
  <span class="sep"></span>
  <button id="un" title="Undo" aria-label="Undo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4.5 9H14a6 6 0 0 1 0 12h-2"/></svg></button><button id="re" title="Redo" aria-label="Redo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M19.5 9H10a6 6 0 0 0 0 12h2"/></svg></button>
  <span class="sep"></span>
  <button id="oc" title="Back to centre" aria-label="Centre canvas"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg></button><button id="zr" title="Reset zoom">100%</button>
</div>
<div id="pv"><div class="pb"><button id="pc">Back to canvas</button><b id="pt"></b></div><div id="pages"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),V=$('#v'),W=$('#w'),INK=$('#ink');
const fresh=()=>({items:[],ink:[],cam:{x:innerWidth/2,y:innerHeight/3,z:1}});
let S=fresh(),M={cs:[],cur:null},tool='pen',color='#1f232b',bw=3,nid=1,n0=0;
const ptr=new Map(),els=new Map(),pdfs=new Map(),inkEls=new Map(),selInk=new Set();
let pinch=null,pan=null,drag=null,rs=null,cur=null,er=null,im=null,mq=null,lasso=null,H=[],hi=-1,ct;
const clamp=z=>Math.min(4,Math.max(.1,z));
const W2=e=>[(e.clientX-S.cam.x)/S.cam.z,(e.clientY-S.cam.y)/S.cam.z];
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const touches=()=>[...ptr.values()].filter(p=>p.t==='touch');
const mid=t=>({x:(t[0].x+t[1].x)/2,y:(t[0].y+t[1].y)/2});
const dist=t=>Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2200)};

/* storage */
const db=new Promise(r=>{try{const q=indexedDB.open('notes',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const dbGet=k=>db.then(d=>new Promise(r=>{if(!d)return r();const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}));
const dbSet=(k,v)=>db.then(d=>d&&d.transaction('s','readwrite').objectStore('s').put(v,k));
const isFileItem=i=>!!i.sourceFile||i.type==='pdf'||i.type==='img';
const sum=()=>({p:S.items.filter(i=>i.type==='a4').length,t:S.items.filter(i=>i.type==='text').length,f:S.items.filter(isFileItem).map(i=>i.name||({pdf:'PDF',img:'Image',text:'Text file'}[i.type]||'File'))});
const flush=()=>{const c=M.cs.find(c=>c.id===M.cur);if(c)c.sum=sum();return Promise.all([dbSet('c:'+M.cur,S),dbSet('meta',M)]).catch(()=>{})};
let st;const save=()=>{clearTimeout(st);st=setTimeout(flush,400)};

/* history */
const snap=()=>({items:S.items.map(i=>({...i})),ink:S.ink.map(s=>({...s,p:s.p.map(q=>[...q])}))});
function commit(){H=H.slice(0,hi+1);H.push(snap());if(H.length>80)H.shift();hi=H.length-1;save()}
function restore(n){clearTimeout(ct);hi=n;const s=H[n];S.items=s.items.map(i=>({...i}));S.ink=s.ink.map(x=>({...x,p:x.p.map(q=>[...q])}));selInk.clear();
  document.querySelectorAll('.item').forEach(x=>x.remove());els.clear();S.items.forEach(mk);renderInk();ctx();save()}
$('#un').onclick=()=>hi>0&&restore(hi-1);$('#re').onclick=()=>hi<H.length-1&&restore(hi+1);

/* camera */
function apply(){const c=S.cam;W.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;V.style.backgroundSize=`${28*c.z}px ${28*c.z}px`;V.style.backgroundPosition=`${c.x}px ${c.y}px`;V.style.setProperty('--grid-alpha',Math.max(.025,Math.min(.55,(c.z-.1)/.9*.55)).toFixed(3));V.style.setProperty('--grid-dot-radius',Math.max(.22,1.3*Math.sqrt(c.z)).toFixed(2)+'px');$('#zr').textContent=Math.round(c.z*100)+'%';save()}
function zoomAt(px,py,z){const c=S.cam,wx=(px-c.x)/c.z,wy=(py-c.y)/c.z;z=clamp(z);c.z=z;c.x=px-wx*z;c.y=py-wy*z;apply()}
const spot=w=>{n0=(n0+1)%6;const c=S.cam;return[Math.max((24-c.x)/c.z,(innerWidth/2-c.x)/c.z-w/2)+n0*20,(90-c.y)/c.z+n0*20]};
$('#oc').onclick=()=>{S.cam.x=innerWidth/2;S.cam.y=innerHeight/2;apply()};
$('#zr').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1);

/* items */
function add(type,x,y,o={}){
  const it={id:nid++,type,x,y,w:{text:320,a4:794}[type]||320,h:type==='a4'?1123:0,html:'',...o};
  S.items.push(it);mk(it);commit();return it}
const sel=e=>{document.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));e&&e.classList.add('sel')};
function mk(it){
  const e=document.createElement('div');e.className='item '+it.type;
  e.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;`+(it.h?`height:${it.h}px`:'');
  e.innerHTML='<div class="h"><b></b><span class="ac"></span><button data-a="del" title="Delete" aria-label="Delete"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="b"></div><div class="r"></div>';
  const h=e.firstChild,b=h.nextSibling;
  h.querySelector('b').textContent={text:it.name||'Text',a4:'Page',table:'Table',img:it.name||'Image',pdf:it.name||'PDF'}[it.type];
  if(it.type==='pdf'){const x=document.createElement('button');x.dataset.a='open';x.textContent='Open';h.querySelector('.ac').append(x)}
  if(it.type==='text'||it.type==='a4'){b.contentEditable=true;b.innerHTML=it.html}
  else if(it.type==='table')b.innerHTML=it.html;
  else if(it.type==='img'){const i=new Image();i.src=it.src;i.draggable=false;b.append(i)}
  else if(it.type==='pdf')thumb(it,b);
  b.addEventListener('input',()=>{it.html=b.innerHTML;save();clearTimeout(ct);ct=setTimeout(commit,900)});
  e.addEventListener('pointerdown',()=>sel(e));
  e.addEventListener('dblclick',()=>it.type==='pdf'&&openPdf(it));
  h.addEventListener('pointerdown',ev=>{if(ev.target.closest('button')||ev.pointerType==='touch'&&touches().length>1)return;drag={id:ev.pointerId,it,e,sx:ev.clientX,sy:ev.clientY,ox:it.x,oy:it.y};h.setPointerCapture(ev.pointerId)});
  e.querySelector('.r').addEventListener('pointerdown',ev=>{rs={id:ev.pointerId,it,e,sx:ev.clientX,sy:ev.clientY,w:it.w,h:it.h};ev.target.setPointerCapture(ev.pointerId)});
  e.addEventListener('click',ev=>{const a=ev.target.dataset.a;
    if(a==='del'){S.items=S.items.filter(i=>i!==it);e.remove();els.delete(it.id);commit()}
    if(a==='open')openPdf(it)});
  W.append(e);els.set(it.id,e)}

/* ink */
const pd=p=>p.length<2?`M${p[0][0]} ${p[0][1]}l0 .1`:'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
function inkEl(s){const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',pd(s.p));el.setAttribute('stroke',s.c);el.setAttribute('stroke-width',s.w||2.6);INK.append(el);inkEls.set(s,el);return el}
const renderInk=()=>{INK.innerHTML='';inkEls.clear();S.ink.forEach(inkEl);paintSel()};
const paintSel=()=>inkEls.forEach((el,s)=>el.classList.toggle('sel',selInk.has(s)));
const hit=(x,y)=>{const r=12/S.cam.z;return[...S.ink].reverse().find(s=>s.p.some(q=>Math.hypot(q[0]-x,q[1]-y)<r))};
const insidePoly=(p,poly)=>{let yes=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1]+Number.EPSILON)+a[0]))yes=!yes}return yes};
function erase(e){const[x,y]=W2(e),r=(10+bw)/S.cam.z,n=S.ink.length;S.ink=S.ink.filter(s=>!s.p.some(q=>Math.hypot(q[0]-x,q[1]-y)<r));if(S.ink.length!==n){er.n=1;renderInk()}}

/* pointers: pen/mouse act, fingers pan and pinch; every gesture is owned by one pointer id */
V.addEventListener('pointerdown',e=>{
  $('#menu').classList.remove('open');
  if(e.pointerType==='touch'&&(cur||er!==null))return;               // palm while writing
  if(e.pointerType==='pen'){ptr.forEach((v,k)=>v.t==='touch'&&ptr.delete(k));pan=pinch=null}
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});
  const t=touches();
  if(t.length===2){drag=rs=pan=null;const c=mid(t),z=S.cam.z;pinch={d:dist(t),z,wx:(c.x-S.cam.x)/z,wy:(c.y-S.cam.y)/z};return}
  if(e.target.closest('.item'))return;
  sel(null);
  const fingers=e.pointerType==='touch';
  if(!fingers&&e.button===1){pan={id:e.pointerId,x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y};V.setPointerCapture(e.pointerId);return}
  if(!fingers&&tool==='pen'){V.setPointerCapture(e.pointerId);selInk.clear();ctx();const pressure=e.pointerType==='pen'&&e.pressure>0?e.pressure:0;const s={c:color,w:bw,baseW:bw,pressureSum:pressure,pressureCount:pressure?1:0,p:[W2(e)]};S.ink.push(s);cur={id:e.pointerId,s,el:inkEl(s)};return}
  if(!fingers&&tool==='eraser'){V.setPointerCapture(e.pointerId);er={id:e.pointerId};erase(e);return}
  if(!fingers&&tool==='select'){
    V.setPointerCapture(e.pointerId);const[x,y]=W2(e),h=hit(x,y);
    if(h){if(!selInk.has(h)){selInk.clear();selInk.add(h)}paintSel();ctx();im={id:e.pointerId,sx:e.clientX,sy:e.clientY,l:[...selInk].map(s=>[s,s.p]),moved:false}}
    else{selInk.clear();paintSel();ctx();mq={id:e.pointerId,x0:e.clientX,y0:e.clientY}}
    return}
  if(!fingers&&tool==='lasso'){
    V.setPointerCapture(e.pointerId);selInk.clear();paintSel();ctx();
    const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.classList.add('lasso-outline');INK.append(el);
    lasso={id:e.pointerId,p:[W2(e)],el};return}
  pan={id:e.pointerId,x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y};V.setPointerCapture(e.pointerId)});
V.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY}
  const id=e.pointerId,z=S.cam.z;
  if(cur&&cur.id===id){for(const c of(e.getCoalescedEvents?.()||[e])){cur.s.p.push(W2(c));const pr=(c.pointerType||e.pointerType)==='pen'?Number(c.pressure):0;if(pr>0){cur.s.pressureSum=(cur.s.pressureSum||0)+pr;cur.s.pressureCount=(cur.s.pressureCount||0)+1;cur.s.w=cur.s.baseW*(.45+cur.s.pressureSum/cur.s.pressureCount*1.1)}}cur.el.setAttribute('d',pd(cur.s.p));cur.el.setAttribute('stroke-width',cur.s.w||bw)}
  else if(er&&er.id===id)erase(e);
  else if(im&&im.id===id){const dx=(e.clientX-im.sx)/z,dy=(e.clientY-im.sy)/z;im.moved=true;for(const[s,o]of im.l){s.p=o.map(q=>[q[0]+dx,q[1]+dy]);inkEls.get(s).setAttribute('d',pd(s.p))}}
  else if(lasso&&lasso.id===id){const q=W2(e),last=lasso.p[lasso.p.length-1];if(Math.hypot(q[0]-last[0],q[1]-last[1])>2/S.cam.z)lasso.p.push(q);lasso.el.setAttribute('d',pd(lasso.p)+'Z')}
  else if(mq&&mq.id===id){const m=$('#mq');Object.assign(m.style,{display:'block',left:Math.min(mq.x0,e.clientX)+'px',top:Math.min(mq.y0,e.clientY)+'px',width:Math.abs(e.clientX-mq.x0)+'px',height:Math.abs(e.clientY-mq.y0)+'px'})}
  else if(drag&&drag.id===id){drag.moved=1;drag.it.x=drag.ox+(e.clientX-drag.sx)/z;drag.it.y=drag.oy+(e.clientY-drag.sy)/z;drag.e.style.left=drag.it.x+'px';drag.e.style.top=drag.it.y+'px'}
  else if(rs&&rs.id===id){rs.moved=1;const w=Math.max(100,rs.w+(e.clientX-rs.sx)/z);rs.it.w=w;rs.e.style.width=w+'px';
    if(rs.it.type==='a4'){rs.it.h=Math.max(160,rs.h+(e.clientY-rs.sy)/z);rs.e.style.height=rs.it.h+'px'}}
  else if(pan&&pan.id===id){S.cam.x=pan.cx+e.clientX-pan.x;S.cam.y=pan.cy+e.clientY-pan.y;apply()}
  else if(pinch&&p&&p.t==='touch'){const t=touches();if(t.length>=2){const c=mid(t),nz=clamp(pinch.z*dist(t)/pinch.d);S.cam.z=nz;S.cam.x=c.x-pinch.wx*nz;S.cam.y=c.y-pinch.wy*nz;apply()}}});
const up=e=>{const id=e.pointerId;ptr.delete(id);if(touches().length<2)pinch=null;
  if(cur&&cur.id===id){cur=null;commit()}
  if(er&&er.id===id){const n=er.n;er=null;n&&commit()}
  if(im&&im.id===id){const m=im.moved;im=null;m&&commit()}
  if(lasso&&lasso.id===id){const active=lasso;lasso=null;active.el.remove();if(active.p.length>=3){S.ink.forEach(s=>{if(s.p.some(q=>insidePoly(q,active.p)))selInk.add(s)})}else if(active.p.length){const q=active.p[0],h=hit(q[0],q[1]);if(h)selInk.add(h)}paintSel();ctx()}
  if(mq&&mq.id===id){const m=$('#mq'),r=m.getBoundingClientRect(),a=[(r.left-S.cam.x)/S.cam.z,(r.top-S.cam.y)/S.cam.z],b=[(r.right-S.cam.x)/S.cam.z,(r.bottom-S.cam.y)/S.cam.z];
    S.ink.forEach(s=>s.p.some(q=>q[0]>=a[0]&&q[0]<=b[0]&&q[1]>=a[1]&&q[1]<=b[1])&&selInk.add(s));m.style.display='none';mq=null;paintSel();ctx()}
  if(drag&&drag.id===id){const m=drag.moved;drag=null;m&&commit()}
  if(rs&&rs.id===id){const m=rs.moved;rs=null;m&&commit()}
  if(pan&&pan.id===id)pan=null};
V.addEventListener('pointerup',up);V.addEventListener('pointercancel',up);
V.addEventListener('wheel',e=>{e.preventDefault();const c=S.cam;
  if(e.ctrlKey||e.metaKey){zoomAt(e.clientX,e.clientY,c.z*Math.exp(-e.deltaY*.01));return}
  /* Ordinary discrete mouse wheels zoom; smooth trackpad scrolls still pan. */
  const dy=Math.abs(e.deltaY),notch=Math.abs(e.wheelDelta||0);
  const mouseWheel=e.deltaMode!==0||notch>=80||(dy>=40&&[40,60,80,100,120].some(n=>Math.abs(dy-n)<1)&&Math.abs(e.deltaX)<1);
  if(mouseWheel){const unit=e.deltaMode===1?.045:.0018;zoomAt(e.clientX,e.clientY,c.z*Math.exp(-e.deltaY*unit))}
  else{c.x-=e.deltaX;c.y-=e.deltaY;apply()}},{passive:false});
['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));

/* toolbar */
$('#bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tool=b.dataset.t;V.classList.toggle('pen',tool!=='select');document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));if(tool==='pen'||tool==='eraser'){selInk.clear();paintSel();ctx()}}
  if(b.dataset.w){bw=+b.dataset.w;document.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.n){$('[data-t=select]').click();const w={text:320,a4:794}[b.dataset.n],it=add(b.dataset.n,...spot(w)),el=els.get(it.id);sel(el);el.querySelector('[contenteditable=true]')?.focus()}});
$('#col').oninput=e=>color=e.target.value;
$('#fi').onchange=async e=>{for(const f of e.target.files)await addFile(f,...spot(320));e.target.value=''};

/* text formatting + tables inside text and pages */
const cell=()=>{const n=getSelection().anchorNode;return n&&(n.nodeType===1?n:n.parentElement)?.closest('td')};
const ex=(c,v)=>document.execCommand(c,false,v);
const F={b:()=>ex('bold'),i:()=>ex('italic'),u:()=>ex('underline'),l:()=>ex('insertUnorderedList'),
  h:()=>ex('formatBlock',document.queryCommandValue('formatBlock').toLowerCase()==='h2'?'div':'h2'),
  t:()=>ex('insertHTML','<table>'+('<tr>'+'<td><br></td>'.repeat(3)+'</tr>').repeat(3)+'</table><br>'),
  row:()=>{const c=cell();if(!c)return;const r=c.parentElement.cloneNode(true);r.querySelectorAll('td').forEach(t=>t.innerHTML='<br>');c.parentElement.after(r);c.closest('.b').dispatchEvent(new Event('input'))},
  col:()=>{const c=cell();if(!c)return;const i=c.cellIndex,b=c.closest('.b');for(const r of c.closest('table').rows)r.cells[i]?.after(Object.assign(document.createElement('td'),{innerHTML:'<br>'}));b.dispatchEvent(new Event('input'))},
  di:()=>{S.ink=S.ink.filter(s=>!selInk.has(s));selInk.clear();renderInk();ctx();commit()}};
const fmt=$('#fmt');
['mousedown','touchstart'].forEach(t=>fmt.addEventListener(t,e=>e.preventDefault(),{passive:false}));
fmt.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();F[b.dataset.f]()}});
const ctx=()=>{const ed=document.activeElement?.closest?.('[contenteditable=true]');fmt.dataset.m=selInk.size?'i':ed?'t':''};
addEventListener('focusin',()=>setTimeout(ctx));addEventListener('focusout',()=>setTimeout(ctx));
addEventListener('keydown',e=>{if(document.activeElement?.closest?.('[contenteditable=true]'))return;
  if((e.key==='Delete'||e.key==='Backspace')&&selInk.size)F.di();
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?$('#re').click():$('#un').click()}});

/* files */
const rd=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
async function addFile(f,x,y){
  if(f.type.startsWith('image/')){const src=await rd(f),im=new Image();im.src=src;await im.decode().catch(()=>{});add('img',x,y,{src,name:f.name,sourceFile:true,w:Math.min(im.naturalWidth||400,500)})}
  else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))add('pdf',x,y,{src:await rd(f),name:f.name,sourceFile:true,w:260});
  else if(f.type.startsWith('text/')||/\.(txt|md)$/i.test(f.name))add('text',x,y,{html:esc(await f.text()),name:f.name,sourceFile:true,w:420});
  else toast('Unsupported file type')}
addEventListener('paste',async e=>{const fs=[...e.clipboardData.files];
  if(fs.length){e.preventDefault();for(const f of fs)await addFile(f,...spot(320));return}
  if(!e.target.isContentEditable){const t=e.clipboardData.getData('text/plain');if(t)add('text',...spot(320),{html:esc(t),w:400})}});
V.addEventListener('dragover',e=>e.preventDefault());
V.addEventListener('drop',async e=>{e.preventDefault();const[x,y]=W2(e);let i=0;for(const f of e.dataTransfer.files)await addFile(f,x+20*i,y+20*i++)});

/* PDF: enter a document, pull pages onto the canvas */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const load1=it=>{if(!pdfs.has(it.id))pdfs.set(it.id,pdfjsLib.getDocument({data:Uint8Array.from(atob(it.src.split(',')[1]),c=>c.charCodeAt(0))}).promise);return pdfs.get(it.id)};
async function thumb(it,b){
  try{const d=await load1(it),pg=await d.getPage(1),v=pg.getViewport({scale:it.w*2/pg.getViewport({scale:1}).width}),c=document.createElement('canvas');
    c.width=v.width;c.height=v.height;b.prepend(c);
    const l=document.createElement('div');l.className='cap';l.textContent=d.numPages+(d.numPages>1?' pages':' page');b.append(l);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
  catch{b.textContent='Could not read this PDF'}}
async function openPdf(it){
  const d=await load1(it),box=$('#pages');box.innerHTML='';$('#pt').textContent=it.name||'PDF';$('#pv').classList.add('open');
  for(let i=1;i<=d.numPages;i++){
    const pg=await d.getPage(i),v=pg.getViewport({scale:1.4}),w=document.createElement('div'),c=document.createElement('canvas'),b=document.createElement('button');
    w.className='pg';c.width=v.width;c.height=v.height;b.textContent='Pull out page '+i;
    b.onclick=()=>pull(it,pg,b);w.append(c,b);box.append(w);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
async function pull(it,pg,btn){
  btn.disabled=true;const v=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  it.pulled=(it.pulled||0)+1;
  add('img',it.x+it.w+40+(it.pulled-1)*580,it.y,{src:c.toDataURL('image/jpeg',.9),w:540});
  btn.textContent='On canvas';toast('Page added next to the PDF')}
$('#pc').onclick=()=>$('#pv').classList.remove('open');

/* canvases menu */
$('#mb').onclick=()=>{renderMenu();$('#menu').classList.toggle('open')};
function renderMenu(){const L=$('#cl');L.innerHTML='';
  for(const c of M.cs){const d=document.createElement('div'),s=c.id===M.cur?sum():c.sum||{p:0,t:0,f:[]};d.className='cv'+(c.id===M.cur?' on':'');
    d.innerHTML='<div class="top"><b></b><button data-r title="Rename" aria-label="Rename"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16.5-.8 4.3 4.3-.8L19 8.5 15.5 5z"/><path d="m14.5 6 3.5 3.5"/></svg></button><button data-x title="Delete" aria-label="Delete"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7M14 10v7"/></svg></button></div><small></small><ul></ul>';
    d.querySelector('b').textContent=c.name;
    d.querySelector('small').textContent=`${s.p} pages, ${s.t} text boxes, ${s.f.length} files`;
    s.f.slice(0,12).forEach(n=>{const li=document.createElement('li');li.textContent=n;d.querySelector('ul').append(li)});
    d.onclick=async e=>{const b=e.target.closest('button');
      if(b&&'r'in b.dataset){const n=prompt('Canvas name',c.name);if(n){c.name=n;flush();renderMenu()}return}
      if(b&&'x'in b.dataset){if(M.cs.length>1&&confirm('Delete "'+c.name+'"?')){const was=c.id===M.cur;M.cs=M.cs.filter(x=>x!==c);dbSet('c:'+c.id,null);if(was){M.cur=M.cs[0].id;await openC(M.cur,true)}else flush();renderMenu()}return}
      if(c.id!==M.cur){await openC(c.id);$('#menu').classList.remove('open')}};
     L.append(d)}
  renderFiles()}
function renderFiles(){const L=$('#filelist'),files=S.items.filter(isFileItem);L.innerHTML='';$('#filecount').textContent=files.length;
  if(!files.length){const empty=document.createElement('div');empty.className='file-empty';empty.textContent='No files on this canvas yet.';L.append(empty);return}
  files.forEach(it=>{const row=document.createElement('button'),kind=it.type==='pdf'?'pdf':it.type==='img'?'img':'txt';row.type='button';row.className='file-row';row.title='Show on canvas';
    const badge=document.createElement('span');badge.className='file-icon '+kind;badge.textContent=kind==='pdf'?'PDF':kind==='img'?'IMG':it.name&&/\.md$/i.test(it.name)?'MD':'TXT';
    const info=document.createElement('span');info.className='file-info';const name=document.createElement('b');name.textContent=it.name||({pdf:'PDF document',img:'Image',text:'Text file'}[it.type]||'File');const meta=document.createElement('small');meta.textContent=kind==='pdf'?'PDF document':kind==='img'?'Image file':'Text document';info.append(name,meta);
    row.append(badge,info);row.onclick=()=>{const el=els.get(it.id);if(!el)return;$('#menu').classList.remove('open');const z=S.cam.z;S.cam.x=innerWidth/2-(it.x+(it.w||320)/2)*z;S.cam.y=innerHeight/2-(it.y+(el.offsetHeight||it.h||100)/2)*z;apply();sel(el)};L.append(row)})}
async function openC(id,skip){if(!skip)await flush();M.cur=id;S=(await dbGet('c:'+id))||fresh();show();flush()}
$('#nc').onclick=async()=>{const id='c'+Date.now();M.cs.push({id,name:'Canvas '+(M.cs.length+1)});await openC(id);renderMenu()};
function show(){V.classList.toggle('pen',tool!=='select');document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x.dataset.t===tool));document.querySelectorAll('.item').forEach(x=>x.remove());els.clear();selInk.clear();
  nid=Math.max(0,...S.items.map(i=>i.id))+1;S.items.forEach(mk);renderInk();H=[snap()];hi=0;ctx();apply()}

(async()=>{
