<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161a">
<title>Canvas Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#14161a;--dot:#2a2d35;--panel:#1e2128;--bd:#2f333c;--tx:#e7e9ee;--mut:#8b90a0;--ac:#6ea8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:14px/1.5 Poppins,system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#v{position:fixed;inset:0;touch-action:none;background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:28px 28px}
#v.pen{cursor:crosshair}
#w{position:absolute;left:0;top:0;transform-origin:0 0}
.item{position:absolute;background:var(--panel);border:1px solid var(--bd);border-radius:8px;box-shadow:0 6px 24px #0006}
.item.sel{outline:2px solid var(--ac);outline-offset:1px}
.pen .item{pointer-events:none}
.h{height:30px;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;font-size:12px;color:var(--mut);cursor:grab;touch-action:none;border-bottom:1px solid var(--bd)}
.h b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .ac{display:flex;gap:4px}
.h button{border:0;background:#ffffff12;border-radius:6px;height:22px;padding:0 8px;font-size:12px}
.b{padding:10px 12px;outline:0;min-height:56px;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.text .b:empty:before{content:"Write something";color:var(--mut)}
.a4{background:#fbfaf7;color:#1b1b1f;overflow:hidden}
.a4 .h{background:#efede7;border-color:#dcd9d0}
.a4 .b{height:calc(100% - 30px);padding:64px 72px;font-size:16px;overflow:hidden}
.table .b{padding:8px;white-space:normal}
table{border-collapse:collapse;width:100%}
td{border:1px solid var(--bd);padding:6px 8px;min-width:60px;vertical-align:top;outline:0}
.img .b,.pdf .b{padding:0}
.img img,.pdf canvas{display:block;width:100%;height:auto;border-radius:0 0 7px 7px;pointer-events:none}
.cap{padding:6px 10px;font-size:12px;color:var(--mut)}
.r{position:absolute;right:0;bottom:0;width:26px;height:26px;touch-action:none;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,var(--ac) 55% 64%,transparent 64% 76%,var(--ac) 76% 85%,transparent 85%);opacity:.8}
#ink{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:5}
#ink path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;background:#1e2128ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:16px;box-shadow:0 8px 30px #0008;max-width:96vw;overflow-x:auto;z-index:10}
#bar button,#bar label{min-width:46px;height:44px;border:0;border-radius:11px;background:none;display:flex;align-items:center;justify-content:center;padding:0 12px;cursor:pointer}
#bar .on{background:var(--ac);color:#0b1020;font-weight:500}
#bar .sep{width:1px;height:24px;background:var(--bd);margin:0 6px}
#col{width:30px;height:30px;border:0;padding:0;border-radius:50%;background:none;margin:0 6px}
#pv{position:fixed;inset:0;z-index:20;background:#0d0e11;display:none;flex-direction:column}
#pv.open{display:flex}
.pb{display:flex;align-items:center;gap:14px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--bd)}
.pb button,.pg button{border:0;background:var(--ac);color:#0b1020;border-radius:9px;height:34px;padding:0 14px;font-weight:500}
.pg button:disabled{background:#3a3f4b;color:var(--mut)}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pg{position:relative;max-width:100%}
.pg canvas{display:block;max-width:100%;height:auto;border-radius:3px}
.pg button{position:absolute;top:10px;right:10px}
#toast{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--bd);padding:8px 14px;border-radius:10px;z-index:30;display:none}
</style></head><body>
<div id="v"><div id="w"><svg id="ink"></svg></div></div>
<div id="bar">
  <button data-t="select" class="on">Move</button>
  <button data-t="pen">Pen</button>
  <button data-t="eraser">Erase</button>
  <input type="color" id="col" value="#6ea8ff" title="Pen colour">
  <span class="sep"></span>
  <button data-n="text">Text</button>
  <button data-n="a4">A4</button>
  <button data-n="table">Table</button>
  <label>File<input type="file" id="fi" hidden multiple accept="image/*,application/pdf,.txt,.md"></label>
  <span class="sep"></span>
  <button id="zr">100%</button>
</div>
<div id="pv"><div class="pb"><button id="pc">Back to canvas</button><b id="pt"></b></div><div id="pages"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),V=$('#v'),W=$('#w'),INK=$('#ink');
let S={items:[],ink:[],cam:{x:80,y:80,z:1}},tool='select',color='#6ea8ff',nid=1,n0=0;
const ptr=new Map(),els=new Map(),pdfs=new Map();
let pinch=null,pan=null,drag=null,rs=null,cur=null,erasing=false;
const clamp=z=>Math.min(4,Math.max(.1,z));
const W2=e=>[(e.clientX-S.cam.x)/S.cam.z,(e.clientY-S.cam.y)/S.cam.z];
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const touches=()=>[...ptr.values()].filter(p=>p.t==='touch');
const mid=t=>({x:(t[0].x+t[1].x)/2,y:(t[0].y+t[1].y)/2});
const dist=t=>Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2200)};

/* storage (IndexedDB) */
const db=new Promise(r=>{try{const q=indexedDB.open('notes',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}});
const dbGet=()=>db.then(d=>new Promise(r=>{if(!d)return r();const q=d.transaction('s').objectStore('s').get('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r()}));
const dbSet=v=>db.then(d=>d&&d.transaction('s','readwrite').objectStore('s').put(v,'k'));
let st;const save=()=>{clearTimeout(st);st=setTimeout(()=>dbSet(S).catch(()=>{}),400)};

/* camera */
function apply(){const c=S.cam;W.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;V.style.backgroundSize=`${28*c.z}px ${28*c.z}px`;V.style.backgroundPosition=`${c.x}px ${c.y}px`;$('#zr').textContent=Math.round(c.z*100)+'%';save()}
function zoomAt(px,py,z){const c=S.cam,wx=(px-c.x)/c.z,wy=(py-c.y)/c.z;z=clamp(z);c.z=z;c.x=px-wx*z;c.y=py-wy*z;apply()}
const spot=w=>{n0=(n0+1)%6;const c=S.cam;return[Math.max((24-c.x)/c.z,(innerWidth/2-c.x)/c.z-w/2)+n0*20,(70-c.y)/c.z+n0*20]};

/* items */
function add(type,x,y,o={}){
  const it={id:nid++,type,x,y,w:{text:320,table:440,a4:794}[type]||320,h:type==='a4'?1123:0,html:'',...o};
  if(type==='table'&&!it.html)it.html='<table>'+('<tr>'+'<td contenteditable=true><br></td>'.repeat(3)+'</tr>').repeat(3)+'</table>';
  S.items.push(it);mk(it);save();return it}
const sel=e=>{document.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));e&&e.classList.add('sel')};
function mk(it){
  const e=document.createElement('div');e.className='item '+it.type;
  e.style.cssText=`left:${it.x}px;top:${it.y}px;width:${it.w}px;`+(it.h?`height:${it.h}px`:'');
  e.innerHTML='<div class="h"><b></b><span class="ac"></span><button data-a="del" title="Delete">✕</button></div><div class="b"></div><div class="r"></div>';
  const h=e.firstChild,b=h.nextSibling,ac=h.querySelector('.ac');
  h.querySelector('b').textContent={text:'Text',a4:'A4 page',table:'Table',img:'Image',pdf:it.name||'PDF'}[it.type];
  const mkb=(a,t)=>{const x=document.createElement('button');x.dataset.a=a;x.textContent=t;ac.append(x)};
  if(it.type==='table'){mkb('row','+ Row');mkb('col','+ Col')}
  if(it.type==='pdf')mkb('open','Open');
  if(it.type==='text'||it.type==='a4'){b.contentEditable=true;b.innerHTML=it.html}
  else if(it.type==='table')b.innerHTML=it.html;
  else if(it.type==='img'){const i=new Image();i.src=it.src;i.draggable=false;b.append(i)}
  else if(it.type==='pdf')thumb(it,b);
  b.addEventListener('input',()=>{it.html=b.innerHTML;save()});
  e.addEventListener('pointerdown',()=>sel(e));
  e.addEventListener('dblclick',()=>it.type==='pdf'&&openPdf(it));
  h.addEventListener('pointerdown',ev=>{if(ev.target.closest('button')||touches().length>1)return;drag={it,e,sx:ev.clientX,sy:ev.clientY,ox:it.x,oy:it.y};h.setPointerCapture(ev.pointerId)});
  e.querySelector('.r').addEventListener('pointerdown',ev=>{rs={it,e,sx:ev.clientX,sy:ev.clientY,w:it.w,h:it.h};ev.target.setPointerCapture(ev.pointerId)});
  e.addEventListener('click',ev=>{const a=ev.target.dataset.a;if(!a)return;
    if(a==='del'){S.items=S.items.filter(i=>i!==it);e.remove();els.delete(it.id);save()}
    if(a==='open')openPdf(it);
    if(a==='row'){const t=b.querySelector('table'),r=t.insertRow();for(let i=0;i<t.rows[0].cells.length;i++){const c=r.insertCell();c.contentEditable=true}}
    if(a==='col'){for(const r of b.querySelector('table').rows){const c=r.insertCell();c.contentEditable=true}}
    if(a==='row'||a==='col'){it.html=b.innerHTML;save()}});
  W.append(e);els.set(it.id,e)}

/* ink */
const pd=p=>p.length<2?`M${p[0][0]} ${p[0][1]}l0 .1`:'M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');
function inkEl(s){const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',pd(s.p));el.setAttribute('stroke',s.c);INK.append(el);return el}
const renderInk=()=>{INK.innerHTML='';S.ink.forEach(inkEl)};
function erase(e){const[x,y]=W2(e),r=14/S.cam.z,n=S.ink.length;S.ink=S.ink.filter(s=>!s.p.some(q=>Math.hypot(q[0]-x,q[1]-y)<r));if(S.ink.length!==n){renderInk();save()}}

/* pointer handling: pen/mouse draw, fingers pan and pinch */
V.addEventListener('pointerdown',e=>{
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,t:e.pointerType});
  const t=touches();
  if(t.length===2){drag=rs=pan=cur=null;erasing=false;const c=mid(t),z=S.cam.z;pinch={d:dist(t),z,wx:(c.x-S.cam.x)/z,wy:(c.y-S.cam.y)/z};return}
  if(e.target.closest('.item'))return;
  sel(null);
  if((tool==='pen'||tool==='eraser')&&e.pointerType!=='touch'){
    V.setPointerCapture(e.pointerId);
    if(tool==='pen'){const s={c:color,p:[W2(e)]};S.ink.push(s);cur={s,el:inkEl(s)}}else{erasing=true;erase(e)}
    return}
  if(e.button===0||e.button===1||e.pointerType==='touch'){pan={x:e.clientX,y:e.clientY,cx:S.cam.x,cy:S.cam.y};V.setPointerCapture(e.pointerId)}
});
V.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY}
  if(pinch){const t=touches();if(t.length>=2){const c=mid(t),z=clamp(pinch.z*dist(t)/pinch.d);S.cam.z=z;S.cam.x=c.x-pinch.wx*z;S.cam.y=c.y-pinch.wy*z;apply()}return}
  const z=S.cam.z;
  if(drag){drag.it.x=drag.ox+(e.clientX-drag.sx)/z;drag.it.y=drag.oy+(e.clientY-drag.sy)/z;drag.e.style.left=drag.it.x+'px';drag.e.style.top=drag.it.y+'px';save()}
  else if(rs){const w=Math.max(120,rs.w+(e.clientX-rs.sx)/z);rs.it.w=w;rs.e.style.width=w+'px';
    if(rs.it.type==='a4'){rs.it.h=Math.max(160,rs.h+(e.clientY-rs.sy)/z);rs.e.style.height=rs.it.h+'px'}save()}
  else if(pan){S.cam.x=pan.cx+e.clientX-pan.x;S.cam.y=pan.cy+e.clientY-pan.y;apply()}
  else if(cur){for(const c of(e.getCoalescedEvents?.()||[e]))cur.s.p.push(W2(c));cur.el.setAttribute('d',pd(cur.s.p))}
  else if(erasing)erase(e)});
const up=e=>{ptr.delete(e.pointerId);if(touches().length<2)pinch=null;drag=rs=pan=null;if(cur){save();cur=null}erasing=false};
V.addEventListener('pointerup',up);V.addEventListener('pointercancel',up);
V.addEventListener('wheel',e=>{e.preventDefault();const c=S.cam;
  if(e.ctrlKey||e.metaKey)zoomAt(e.clientX,e.clientY,c.z*Math.exp(-e.deltaY*.01));else{c.x-=e.deltaX;c.y-=e.deltaY;apply()}},{passive:false});
['gesturestart','gesturechange'].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));

/* toolbar */
$('#bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){tool=b.dataset.t;V.classList.toggle('pen',tool!=='select');document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b))}
  if(b.dataset.n){$('[data-t=select]').click();const w={text:320,table:440,a4:794}[b.dataset.n],it=add(b.dataset.n,...spot(w)),el=els.get(it.id);sel(el);el.querySelector('[contenteditable=true]')?.focus()}
  if(b.id==='zr')zoomAt(innerWidth/2,innerHeight/2,1)});
$('#col').oninput=e=>color=e.target.value;
$('#fi').onchange=async e=>{for(const f of e.target.files)await addFile(f,...spot(320));e.target.value=''};

/* files: images, PDFs, text */
const rd=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
async function addFile(f,x,y){
  if(f.type.startsWith('image/')){const src=await rd(f),im=new Image();im.src=src;await im.decode().catch(()=>{});add('img',x,y,{src,w:Math.min(im.naturalWidth||400,500)})}
  else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){add('pdf',x,y,{src:await rd(f),name:f.name,w:260})}
  else if(f.type.startsWith('text/')||/\.(txt|md)$/i.test(f.name)){add('text',x,y,{html:esc(await f.text()),w:420})}
  else toast('Unsupported file type')}
addEventListener('paste',async e=>{const fs=[...e.clipboardData.files];
  if(fs.length){e.preventDefault();for(const f of fs)await addFile(f,...spot(320));return}
  if(!e.target.isContentEditable){const t=e.clipboardData.getData('text/plain');if(t)add('text',...spot(320),{html:esc(t),w:400})}});
V.addEventListener('dragover',e=>e.preventDefault());
V.addEventListener('drop',async e=>{e.preventDefault();const[x,y]=W2(e);let i=0;for(const f of e.dataTransfer.files)await addFile(f,x+20*i,y+20*i++)});

/* PDF: enter a document, pull pages onto the canvas */
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const load=it=>{if(!pdfs.has(it.id))pdfs.set(it.id,pdfjsLib.getDocument({data:Uint8Array.from(atob(it.src.split(',')[1]),c=>c.charCodeAt(0))}).promise);return pdfs.get(it.id)};
async function thumb(it,b){
  try{const d=await load(it),pg=await d.getPage(1),v=pg.getViewport({scale:it.w*2/pg.getViewport({scale:1}).width}),c=document.createElement('canvas');
    c.width=v.width;c.height=v.height;b.prepend(c);
    const l=document.createElement('div');l.className='cap';l.textContent=d.numPages+(d.numPages>1?' pages':' page');b.append(l);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}
  catch{b.textContent='Could not read this PDF'}}
async function openPdf(it){
  const d=await load(it),box=$('#pages');box.innerHTML='';$('#pt').textContent=it.name||'PDF';$('#pv').classList.add('open');
  for(let i=1;i<=d.numPages;i++){
    const pg=await d.getPage(i),v=pg.getViewport({scale:1.4}),w=document.createElement('div'),c=document.createElement('canvas'),b=document.createElement('button');
    w.className='pg';c.width=v.width;c.height=v.height;b.textContent='Pull out page '+i;
    b.onclick=()=>pull(it,pg,b);w.append(c,b);box.append(w);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise}}
async function pull(it,pg,btn){
  btn.disabled=true;const v=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
  it.pulled=(it.pulled||0)+1;
  add('img',it.x+it.w+40+(it.pulled-1)*580,it.y,{src:c.toDataURL('image/jpeg',.9),w:540});
  btn.textContent='On canvas';toast('Page added next to the PDF')}
$('#pc').onclick=()=>$('#pv').classList.remove('open');

/* boot */
(async()=>{
  try{const s=await dbGet();if(s&&s.items){S=s;nid=Math.max(0,...S.items.map(i=>i.id))+1}}catch{}
  S.items.forEach(mk);renderInk();apply();navigator.storage?.persist?.()})();
</script></body></html>
